# ---------------------------------------------------------------------------
# Human BlackBox v2 — Gradle properties.
#
# These are the build-wide knobs Gradle reads before any module is configured.
# They are kept here (rather than in each module) so that the Android SDK, the
# Kotlin toolchain and the native toolchains are resolved consistently across
# :app, :core, :sensors, :ml-* and :scripts.
#
#   android.sdk.dir        location of the Android SDK (default: ANDROID_SDK_ROOT)
#   android.useAndroidX    enable the AndroidX dependency coordinates
#   android.defaults.buildType.injectApplicationId
#   org.gradle.jvmargs     JVM heap for the Gradle daemon
#   org.gradle.caching     enable Gradle build cache (offline-friendly)
#   org.gradle.daemon      use the daemon (faster builds)
#   org.gradle.parallel     parallel task execution
#   org.gradle.workers.max  max worker processes
#   org.gradle.native.tools
#   org.gradle.caching.local
# ---------------------------------------------------------------------------

android.sdk.dir=/opt/android-sdk
android.useAndroidX=true
android.defaults.buildType.injectApplicationId=true
android.nonTransitiveRClass=true
android.suppressGradleRuntimesWarning=true

org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching.local=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.maxsize=200
org.gradle.configuration-cache.disabled=false

org.gradle.native.tools=true
org.gradle.native.caching=true
org.gradle.caching.remote=false

android.experimental.androidv2Signing=true
android.experimental.androidv2SigningKeystore=/home/MASTER-H/Documents/Bachelor Thesis/human-blackbox/keystore/debug.keystore
android.experimental.androidv2SigningKeyAlias=debug
android.experimental.androidv2SigningKeyPassword=debug
android.experimental.androidv2SigningEnabled=true

# Kotlin — the versions declared in build.gradle.kts are authoritative; these
# settings only pin the toolchain and the Android plugin compatibility.
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
kotlin.incremental=true
kotlin.incremental.gradleTargetDir=.gradle
kotlin.incremental.useTaskPathForArtifact=true

# Dependency resolution.
org.gradle.dependency.cache=true
org.gradle.dependency.verification=false
org.gradle.internal.platform.resolver.verification=false

# GraalVM / native-image (only exercised when the native task is requested).
org.graalvm.buildtools.native.tasks.enable=false
org.graalvm.buildtools.native.enabled=false